name: ms_finance
description: "MS Finance - personal finance manager"
version: 1.7.2+72
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  uuid: ^4.2.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  math_expressions: ^2.4.0
  url_launcher: ^6.2.5
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  flutter_secure_storage: ^10.3.4
  local_auth: ^2.3.0
  file_picker: ^12.3.0
  core_database:
    path: packages/core/core_database

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MS Finance.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
